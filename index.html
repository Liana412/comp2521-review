const TEMPLATES=[
{category:'Graph',name:'BFS · 邻接矩阵',desc:'Queue + visited + pred；遍历所有 vertex，而不是 edge 数量。',code:`void bfs(Graph g, Vertex src) {
    int nV = GraphNumVertices(g);
    bool *visited = calloc(nV, sizeof(bool));
    int *pred = malloc(nV * sizeof(int));
    for (int i = 0; i < nV; i++) pred[i] = -1;
    Queue q = QueueNew();
    visited[src] = true;
    QueueEnqueue(q, src);
    while (QueueSize(q) > 0) {
        Vertex v = QueueDequeue(q);
        for (Vertex w = 0; w < nV; w++) {
            if (GraphIsAdjacent(g, v, w) && !visited[w]) {
                visited[w] = true;
                pred[w] = v;
                QueueEnqueue(q, w);
            }
        }
    }
    QueueFree(q);
    free(visited);
    free(pred);
}`},
{category:'Graph',name:'DFS · 递归',desc:'visited 在递归前设置；内层循环按 GraphNumVertices(g)。',code:`static void dfsRec(Graph g, Vertex v, bool *visited) {
    visited[v] = true;
    int nV = GraphNumVertices(g);
    for (Vertex w = 0; w < nV; w++) {
        if (GraphIsAdjacent(g, v, w) && !visited[w]) {
            dfsRec(g, w, visited);
        }
    }
}
void dfs(Graph g, Vertex src) {
    int nV = GraphNumVertices(g);
    bool *visited = calloc(nV, sizeof(bool));
    dfsRec(g, src, visited);
    free(visited);
}`},
{category:'Graph',name:'Dijkstra · 伪代码',desc:'非负权图单源最短路。O(V²) 朴素实现；具体 ADT 接口以课程为准。',code:`dist[src] = 0; other dist[] = INF
pred[] = -1; visited[] = false
repeat up to V times:
    choose unvisited vertex v with min dist[v]

    for each outgoing edge v -> w with weight:
        if dist[v] + weight < dist[w]:
            dist[w] = dist[v] + weight

{category:'MST',name:'Prim · 伪代码',desc:'从一个点扩展；每次选连接已访问与未访问点的最小边。',code:`visited[start] = true

{category:'MST',name:'Kruskal · 伪代码',desc:'边排序 + Union-Find；避免形成 cycle。',code:`sort all edges by weight ascending

{category:'Tree',name:'BST · 递归插入',desc:'先处理 NULL，再按 value 决定左右；重复值不插入。',code:`struct node *bstInsert(struct node *t, int value) {
    if (t == NULL) {
        struct node *n = malloc(sizeof(*n));
        n->value = value;
        n->left = n->right = NULL;
        return n;
    }
    if (value < t->value) t->left = bstInsert(t->left, value);
    else if (value > t->value) t->right = bstInsert(t->right, value);
    return t;
}`},
{category:'Tree',name:'BST · 删除最大值',desc:'一直走 right；右子树为空时，用 left 接回原位置。',code:`struct node *bstDeleteLargest(struct node *t, int *max) {
    if (t == NULL) return NULL; // 调用前最好确保非空
    if (t->right == NULL) {
        *max = t->value;
        struct node *left = t->left;
        free(t);
        return left;
    }
    t->right = bstDeleteLargest(t->right, max);
    return t;
}`},
{category:'List',name:'Linked List · 反转',desc:'三个指针 prev/curr/next；O(n) 时间、O(1) 额外空间。',code:`struct node *reverseList(struct node *head) {
    struct node *prev = NULL;
    struct node *curr = head;
    while (curr != NULL) {
        struct node *next = curr->next;
        curr->next = prev;
        prev = curr;
        curr = next;
    }
    return prev;
}`},

.value;save()}})}function resetAttempt(){if(confirm('重置这道题的个人代码吗？')){delete state.attempts[selected];save();render()}}function markMistake(){let q=qget();state.mistakes[q.id]=state.mistakes[q.id]||{highlight:'',note:''};save();toast('已加入错题集，可以添加高亮与注释');setTab('mistakes')}

function editQuestion(id){let q=state.questions.find(x=>x.id===id);setTab('manage');if(!q)return;$('qid').value=q.id;$('qt').value=q.title;$('qs').value=q.source;$('qc').value=q.topic;$('qd').value=q.difficulty;$('qtype').value=questionType(q);$('qp').value=q.prompt;$('qstart').value=q.starter;$('qa').value=q.answer;$('qe').value=q.explanation;$('formTitle').textContent='编辑题目';$('deleteBtn').classList.remove('hidden')}
function clearForm(){setTab('manage')}
function saveQuestion(){let id=$('qid').value||'custom_'+Date.now();let q={id,title:$('qt').value.trim(),source:$('qs').value,topic:$('qc').value.trim()||'Other',difficulty:$('qd').value,type:$('qtype').value,prompt:$('qp').value,starter:$('qstart').value||'// TODO',answer:$('qa').value,explanation:$('qe').value,origin:'个人添加 / 可编辑'};if(!q.title||!q.prompt){toast('请填写标题和题干');return}let i=state.questions.findIndex(x=>x.id===id);if(i>=0)state.questions[i]=q;else state.questions.push(q);selected=id;save();toast('题目已保存');setTab('bank')}
function deleteQuestion(){if(!confirm('确定删除这道题及相关记录吗？'))return;let id=$('qid').value;state.questions=state.questions.filter(q=>q.id!==id);delete state.attempts[id];delete state.mistakes[id];delete state.done[id];selected=state.questions[0]?.id;save();setTab('bank')}
function downloadText(filename,content,type='text/markdown;charset=utf-8'){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportTemplates(){let md='# COMP2521 · 模板代码与 ADT 复习\n\n> 代码模板仅作复习参考。请根据实际课程头文件核对 ADT 接口。\n\n';for(let t of TEMPLATES){md+=`## ${t.category} · ${t.name}\n\n${t.desc}\n\n\`\`\`text\n${t.code}\n\`\`\`\n\n`;}downloadText('COMP2521-templates.md',md);toast('代码模板已导出')}
function exportMistakes(){let arr=state.questions.filter(q=>state.mistakes[q.id]);let md='# COMP2521 · 错题笔记\n\n';if(!arr.length)md+='暂无错题。请先在刷题页面标记错题。\n';for(let q of arr){let m=state.mistakes[q.id],mine=state.attempts[q.id]??q.starter;md+=`## ${q.title}\n\n- 来源：${q.source}\n- 知识点：${q.topic}\n\n**题目：** ${q.prompt}\n\n**高亮错误片段：**\n\n\`\`\`c\n${m.highlight||'（未标注）'}\n\`\`\`\n\n**我的代码：**\n\n\`\`\`c\n${mine}\n\`\`\`\n\n**我的注解：** ${m.note||'（未填写）'}\n\n**参考答案：**\n\n\`\`\`c\n${q.answer||'（暂无答案）'}\n\`\`\`\n\n**解析：** ${q.explanation||'（暂无解析）'}\n\n---\n\n`;}downloadText('COMP2521-mistake-notes.md',md);toast('错题笔记已导出')}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='comp2521-review-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('备份已下载')}
function importData(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(Array.isArray(d)){d={questions:d,notes:{},attempts:{},mistakes:{},done:{}}}if(!Array.isArray(d.questions)||!d.questions.every(q=>q.title&&q.prompt&&q.source)){throw Error('文件不是有效题库')}d.questions=d.questions.map((q,i)=>({...q,id:String(q.id||'import_'+i),starter:q.starter||'// TODO',answer:q.answer||'',explanation:q.explanation||'',topic:q.topic||'Other',difficulty:q.difficulty||'Medium',type:q.type||questionType(q)}));if(!confirm(`追加 / 更新 ${d.questions.length} 道题？同 ID 的题目会更新，原有刷题记录保留。`))return;const old=new Map(state.questions.map(q=>[q.id,q]));d.questions.forEach(q=>old.set(q.id,q));state.questions=[...old.values()];state.topicDone ||= {};state.extraTopics ||= [];selected=state.questions[0]?.id;save();setTab('dashboard');toast('导入成功')}catch(err){toast('导入失败：'+err.message)}};r.readAsText(f)}function resetDemo(){if(!confirm('恢复示例题库并清除所有个人记录？'))return;localStorage.removeItem(KEY);location.reload()}
render();
</script></body></html>
