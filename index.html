<script>
const TEMPLATES=[
{category:'Graph',name:'BFS · 邻接矩阵',desc:'Queue + visited + pred；遍历所有 vertex，而不是 edge 数量。',code:`void bfs(Graph g, Vertex src) {
    int nV = GraphNumVertices(g);
    bool *visited = calloc(nV, sizeof(bool));
    int *pred = malloc(nV * sizeof(int));
    for (int i = 0; i < nV; i++) pred[i] = -1;
    Queue q = QueueNew();
    visited[src] = true;
    QueueEnqueue(q, src);
    while (QueueSize(q) > 0) {
        Vertex v = QueueDequeue(q);
        for (Vertex w = 0; w < nV; w++) {
            if (GraphIsAdjacent(g, v, w) && !visited[w]) {
                visited[w] = true;
                pred[w] = v;
                QueueEnqueue(q, w);
            }
        }
    }
    QueueFree(q);
    free(visited);
    free(pred);
}`},
{category:'Graph',name:'DFS · 递归',desc:'visited 在递归前设置；内层循环按 GraphNumVertices(g)。',code:`static void dfsRec(Graph g, Vertex v, bool *visited) {
    visited[v] = true;
    int nV = GraphNumVertices(g);
    for (Vertex w = 0; w < nV; w++) {
        if (GraphIsAdjacent(g, v, w) && !visited[w]) {
            dfsRec(g, w, visited);
        }
    }
}
void dfs(Graph g, Vertex src) {
    int nV = GraphNumVertices(g);
    bool *visited = calloc(nV, sizeof(bool));
    dfsRec(g, src, visited);
    free(visited);
}`},
{category:'Graph',name:'Dijkstra · 伪代码',desc:'非负权图单源最短路。O(V²) 朴素实现；具体 ADT 接口以课程为准。',code:`dist[src] = 0; other dist[] = INF
pred[] = -1; visited[] = false
repeat up to V times:
    choose unvisited vertex v with min dist[v]
    if none reachable: break
    visited[v] = true
    for each outgoing edge v -> w with weight:
        if dist[v] + weight < dist[w]:
            dist[w] = dist[v] + weight
            pred[w] = v`},
{category:'MST',name:'Prim · 伪代码',desc:'从一个点扩展；每次选连接已访问与未访问点的最小边。',code:`visited[start] = true
while selectedEdges < V - 1:
    find minimum-weight edge (v, w)
    where visited[v] != visited[w]
    if no such edge: graph is disconnected
    add edge to MST
    mark the new vertex visited`},
{category:'MST',name:'Kruskal · 伪代码',desc:'边排序 + Union-Find；避免形成 cycle。',code:`sort all edges by weight ascending
make each vertex its own disjoint set
for each edge (u, v) in sorted order:
    if find(u) != find(v):
        add edge to MST
        union(u, v)
    stop once MST has V - 1 edges`},
{category:'Tree',name:'BST · 递归插入',desc:'先处理 NULL，再按 value 决定左右；重复值不插入。',code:`struct node *bstInsert(struct node *t, int value) {
    if (t == NULL) {
        struct node *n = malloc(sizeof(*n));
        n->value = value;
        n->left = n->right = NULL;
        return n;
    }
    if (value < t->value) t->left = bstInsert(t->left, value);
    else if (value > t->value) t->right = bstInsert(t->right, value);
    return t;
}`},
{category:'Tree',name:'BST · 删除最大值',desc:'一直走 right；右子树为空时，用 left 接回原位置。',code:`struct node *bstDeleteLargest(struct node *t, int *max) {
    if (t == NULL) return NULL; // 调用前最好确保非空
    if (t->right == NULL) {
        *max = t->value;
        struct node *left = t->left;
        free(t);
        return left;
    }
    t->right = bstDeleteLargest(t->right, max);
    return t;
}`},
{category:'List',name:'Linked List · 反转',desc:'三个指针 prev/curr/next；O(n) 时间、O(1) 额外空间。',code:`struct node *reverseList(struct node *head) {
    struct node *prev = NULL;
    struct node *curr = head;
    while (curr != NULL) {
        struct node *next = curr->next;
        curr->next = prev;
        prev = curr;
        curr = next;
    }
    return prev;
}`},
{category:'ADT',name:'Queue / Stack / Priority Queue',desc:'概念速查。函数名因课程提供的 ADT 而不同，请对照头文件。',code:`QUEUE (FIFO): enqueue / dequeue / isEmpty
STACK (LIFO): push / pop / isEmpty
PRIORITY QUEUE: insert / deleteMin / isEmpty

BFS -> Queue
DFS iterative -> Stack
Dijkstra/Prim (optimized) -> Priority Queue`},
{category:'Complexity',name:'复杂度 · 快速记忆',desc:'常用复杂度参考，具体取决于图表示、数据结构和实现。',code:`Linked list search: O(n)
BST find/insert: O(h) [balanced O(log n), worst O(n)]
BFS/DFS (adjacency list): O(V + E)
BFS/DFS (adjacency matrix): O(V^2)
Kruskal (sorting + DSU): O(E log E)
Prim (adjacency matrix): O(V^2)
Dijkstra (naive array): O(V^2)
Merge sort: O(n log n)
Insertion sort: worst O(n^2)`}
];
const KEY = 'comp2521-review-studio-v1';
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch {}
state ||= {};
state.questions = [...new Map([
  ...(Array.isArray(state.questions) ? state.questions : []),
  ...COURSE_QUESTIONS
].map(q => [q.id, q])).values()];
state.attempts ||= {};
state.mistakes ||= {};

let tab = 'practice';
let selected = COURSE_QUESTIONS.some(q => q.id === state.selected)
  ? state.selected : COURSE_QUESTIONS[0].id;
let source = COURSE_QUESTIONS.find(q => q.id === selected).source;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
}[ch]));
const qget = () => state.questions.find(q => q.id === selected);
function save() {
  state.selected = selected;
  localStorage.setItem(KEY, JSON.stringify(state));
}
function toast(message) {
  $('toast').textContent = message;
  $('toast').classList.add('on');
  setTimeout(() => $('toast').classList.remove('on'), 2400);
}
const tabs = [['practice','做题'], ['mistakes','错题'], ['review','速查']];
function setTab(next) {
  tab = next;
  render();
}
function header(title, subtitle = '') {
  return `<h1 class="h1">${title}</h1>${subtitle ? `<p class="sub">${subtitle}</p>` : ''}`;
}
function render() {
  $('nav').innerHTML = tabs.map(([id, label]) =>
    `<button class="${tab === id ? 'active' : ''}" onclick="setTab('${id}')">${label}</button>`
  ).join('');
  ({practice, mistakes, review})[tab]();
}
function selectQuestion(id) {
  selected = id;
  save();
  render();
}
function chooseSource(value) {
  source = value;
  selectQuestion(COURSE_QUESTIONS.find(q => q.source === source).id);
}
function exampleDiagram(q) {
  if (!q.example || q.hasOfficialDiagram) return '';
  const arrays = text => [...text.matchAll(/\[(-?\d+(?:,\s*-?\d+)*)\]/g)].map(m => m[1].split(/,\s*/));
  const chain = text => text.match(/-?\d+(?:\s*[→⇄]\s*-?\d+)+/)?.[0].split(/\s*[→⇄]\s*/);
  const output = arrays(q.example.output)[0] || chain(q.example.output);
  const input = arrays(q.example.input);
  if (!input.length && chain(q.example.input)) input.push(chain(q.example.input));
  if (!input.length || !output) return '';
  const params = [...q.example.input.matchAll(/\b(n|value|k|depth) = (-?\d+)/g)].map(m => m[0]);
  const rows = [...input.map((values, i) => ({values, label: input.length > 1 ? `Input ${i + 1}` : 'Input'})),
    {values:output,label:'Output'}];
  const width = 105 + 41 * Math.max(...rows.map(row => row.values.length));
  return `<figure class="example-figure">
    <figcaption>Example visualization${params.length ? ` · ${esc(params.join(', '))}` : ''}</figcaption>
    <svg viewBox="0 0 ${width} ${rows.length * 40}" role="img" aria-label="${esc(rows.map(row => row.label + ': ' + row.values.join(', ')).join('. '))}">
      ${rows.map(({values,label},row) => `<text x="0" y="${row*40+24}" class="diagram-label">${label}</text>
        ${values.map((value,col) => `<rect x="${82+col*41}" y="${row*40+4}" width="34" height="30" rx="5" class="${label==='Output'?'output-cell':'cell'}"></rect>
          <text x="${99+col*41}" y="${row*40+24}" text-anchor="middle">${esc(value)}</text>`).join('')}`).join('')}
    </svg>
  </figure>`;
}
function practice() {
  const q = qget();
  const official = COURSE_QUESTIONS.find(item => item.id === q.id);
  source = q.source;
  const groups = [...new Set([...COURSE_QUESTIONS.map(q => q.source), source])];
  const questions = COURSE_QUESTIONS.filter(q => q.source === source);
  if (!questions.some(x => x.id === q.id)) questions.unshift(q);
  const index = questions.findIndex(x => x.id === q.id);
  $('view').innerHTML = header('做题') + `
    <div class="question-picker">
      <select aria-label="题目来源" onchange="chooseSource(this.value)">
        ${groups.map(group => `<option${group === source ? ' selected' : ''}>${esc(group)}</option>`).join('')}
      </select>
      <select id="question" aria-label="选择题目" onchange="selectQuestion(this.value)">
        ${questions.map(x => `<option value="${esc(x.id)}"${x.id === q.id ? ' selected' : ''}>${esc(x.title)}</option>`).join('')}
      </select>
      <button class="btn" id="prev" ${index === 0 ? 'disabled' : ''}>上一题</button>
      <button class="btn" id="next" ${index === questions.length - 1 ? 'disabled' : ''}>下一题</button>
    </div>
    <div class="workbench">
    <section class="panel exercise-panel">
      <h2 style="margin-top:0">${esc(q.title)}</h2>
      <div class="statement" lang="en">${official?.statement ?? `<p>${esc(q.prompt)}</p>`}</div>
      ${exampleDiagram(q)}
      ${official?.sourceNotes ? `<details>
        <summary>Original examples, testing and setup notes</summary>
        <div class="statement" lang="en">${official.sourceNotes}</div></details>` : ''}
      ${q.context ? `<details><summary>题目用到的类型和接口</summary>
        <p class="question-text">${esc(q.context)}</p></details>` : ''}
      ${q.origin?.startsWith('https://cgi.cse.unsw.edu.au/') ? `<details>
        <summary>课程原题与配套资料</summary>
        <div class="actions source-links">
          <a href="${esc(q.origin)}" target="_blank" rel="noopener">查看原题</a>
          ${/^https:\/\/(?:www|cgi)\.cse\.unsw\.edu\.au\//.test(q.starterUrl || '') ? `<a href="${esc(q.starterUrl)}" target="_blank" rel="noopener">下载配套文件</a>` : ''}
        </div></details>` : ''}
    </section>
    <section class="panel writing-panel">
      <label class="section-title" for="answerEditor">我的作答</label>
      <textarea class="editor" id="answerEditor" spellcheck="false">${esc(state.attempts[q.id] ?? q.starter)}</textarea>
      <div class="actions section"><button class="btn warn" onclick="markMistake()">加入错题</button></div>
      ${q.answer ? `<details class="solution section"><summary>官方答案 / 解析</summary>
        <pre>${esc(q.answer)}</pre><div class="tip">${esc(q.explanation)}</div>
      </details>` : ''}
    </section>
    </div>`;
  $('prev').onclick = () => selectQuestion(questions[index - 1].id);
  $('next').onclick = () => selectQuestion(questions[index + 1].id);
  const editor = $('answerEditor');
  editor.oninput = () => {
    state.attempts[q.id] = editor.value;
    save();
  };
}
function markMistake() {
  state.mistakes[selected] ||= {highlight:'', note:''};
  save();
  setTab('mistakes');
}
function highlighted(code,fragment){code=String(code||'');if(!fragment)return esc(code);let i=code.indexOf(fragment);if(i<0)return esc(code);return esc(code.slice(0,i))+'<mark class="highlight">'+esc(fragment)+'</mark>'+esc(code.slice(i+fragment.length))}
function mistakes(){let arr=state.questions.filter(q=>state.mistakes[q.id]);if(!arr.length){$('view').innerHTML=header('错题集','错误代码高亮 + 自己的注解，集中复盘薄弱环节。')+`<div class="empty">暂时没有错题。去「做题」做题后，点「加入错题集」。<p><button class="btn primary" onclick="setTab('practice')">开始刷题</button></p></div>`;return}if(!arr.some(q=>q.id===selected))selected=arr[0].id;let q=qget(),m=state.mistakes[q.id];$('view').innerHTML=header('错题集','把写错的代码片段复制到「高亮文本」，再记录原因；下次复习直接看错误与正确答案。')+`<div class="layout"><div class="question-list">${arr.map(x=>`<div class="item ${x.id===selected?'active':''}" onclick="selectQuestion(decodeURIComponent('${encodeURIComponent(x.id).replaceAll("'", "%27")}'))"><span class="tag red">错题</span><strong>${esc(x.title)}</strong><span class="muted-small">${esc(x.topic)}</span></div>`).join('')}</div><div class="panel"><h2 style="margin-top:0">${esc(q.title)}</h2><div class="section-title">你的上次代码（高亮视图）</div><pre id="codeHigh">${highlighted(state.attempts[q.id]??q.starter,m.highlight)}</pre><label class="label">高亮代码片段（原样复制其中一行或部分文字）</label><input id="hi" value="${esc(m.highlight)}" placeholder="例如：if (t == NULL && depth < 0)" oninput="saveMistake()"><label class="label">错误注解 / 为什么错 / 正确思路</label><textarea id="note" rows="4" placeholder="例如：两个退出条件应使用 ||，否则会解引用空指针。" oninput="saveMistake()">${esc(m.note)}</textarea><div class="section-title section">参考答案</div><pre>${esc(q.answer)}</pre><div class="tip">${esc(q.explanation)}</div><div class="actions section"><button class="btn" onclick="setTab('practice')">重新做这题</button><button class="btn warn" onclick="delete state.mistakes[selected];save();render()">移出错题集</button></div></div></div>`}function saveMistake(){let m=state.mistakes[selected];m.highlight=$('hi').value;m.note=$('note').value;$('codeHigh').innerHTML=highlighted(state.attempts[selected]??qget().starter,m.highlight);save()}
function review() {
  $('view').innerHTML = header('速查') + `
    <div class="actions" style="margin-bottom:16px">
      <button class="btn" id="slidesReference" onclick="showReference('slides')">课件笔记</button>
      <button class="btn" id="templateReference" onclick="showReference('templates')">代码模板 / ADT</button>
    </div>
    <div id="referenceContent"></div>`;
  showReference('slides');
}
function showReference(kind) {
  const slides = kind === 'slides';
  $('slidesReference').setAttribute('aria-pressed', String(slides));
  $('templateReference').setAttribute('aria-pressed', String(!slides));
  $('slidesReference').classList.toggle('primary', slides);
  $('templateReference').classList.toggle('primary', !slides);
  if (slides) {
    $('referenceContent').innerHTML = `<section class="panel reference-notes">
      <div class="statement">${SLIDES_NOTES.intro}</div>
      ${SLIDES_NOTES.sections.map(({title, body}) => `<details>
        <summary>${esc(title)}</summary>
        <div class="statement">${body}</div>
      </details>`).join('')}
    </section>`;
    return;
  }
  const groups = ['All', ...new Set(TEMPLATES.map(t => t.category))];
  $('referenceContent').innerHTML = `<div class="actions" style="margin-bottom:18px">
    ${groups.map(group => `<button class="btn" onclick="renderRefs('${group}')">${group}</button>`).join('')}
    </div><div class="ref-grid" id="refs"></div>`;
  renderRefs('All');
}
function renderRefs(g){$('refs').innerHTML=TEMPLATES.filter(t=>g==='All'||t.category===g).map((t,i)=>`<section class="panel ref-card"><div class="head"><div><span class="tag purple">${esc(t.category)}</span><h3 style="margin:8px 0 0">${esc(t.name)}</h3></div><button class="btn" onclick="copyText(${TEMPLATES.indexOf(t)})">复制</button></div><div class="muted-small" style="padding:0 18px 12px">${esc(t.desc)}</div><pre>${esc(t.code)}</pre></section>`).join('')}function copyText(i){navigator.clipboard.writeText(TEMPLATES[i].code).then(()=>toast('模板已复制')).catch(()=>toast('浏览器未授权复制'))}
function downloadText(filename,content,type='text/markdown;charset=utf-8'){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportTemplates(){let md='# COMP2521 · 模板代码与 ADT 复习\n\n> 代码模板仅作复习参考。请根据实际课程头文件核对 ADT 接口。\n\n';for(let t of TEMPLATES){md+=`## ${t.category} · ${t.name}\n\n${t.desc}\n\n\`\`\`text\n${t.code}\n\`\`\`\n\n`;}downloadText('COMP2521-templates.md',md);toast('代码模板已导出')}
function exportMistakes(){let arr=state.questions.filter(q=>state.mistakes[q.id]);let md='# COMP2521 · 错题笔记\n\n';if(!arr.length)md+='暂无错题。请先在刷题页面标记错题。\n';for(let q of arr){let m=state.mistakes[q.id],mine=state.attempts[q.id]??q.starter;md+=`## ${q.title}\n\n- 来源：${q.source}\n- 知识点：${q.topic}\n\n**题目：** ${q.prompt}\n\n**高亮错误片段：**\n\n\`\`\`c\n${m.highlight||'（未标注）'}\n\`\`\`\n\n**我的代码：**\n\n\`\`\`c\n${mine}\n\`\`\`\n\n**我的注解：** ${m.note||'（未填写）'}\n\n**参考答案：**\n\n\`\`\`c\n${q.answer||'（暂无答案）'}\n\`\`\`\n\n**解析：** ${q.explanation||'（暂无解析）'}\n\n---\n\n`;}downloadText('COMP2521-mistake-notes.md',md);toast('错题笔记已导出')}
render();
</script></body></html>
